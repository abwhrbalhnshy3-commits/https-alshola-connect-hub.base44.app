services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alshola
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: on-failure

  server:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/alshola
      - JWT_SECRET=dev-secret-change-me-in-production
      - PORT=4000
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "apk add --no-cache openssl libc6-compat && npm install && npx prisma generate && npx prisma db push --accept-data-loss && node prisma/seed.js && exec npx nodemon src/index.js"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./client:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      server:
        condition: service_healthy
    command: ["sh", "-ec", "npm install && exec npx vite --host 0.0.0.0 --port 5173"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db_data:
  server_node_modules:
  web_node_modules:
